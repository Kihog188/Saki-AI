<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Saki</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Saki</h1>
    <nav>
      <button type="button" id="open-memories">Ghi nhớ</button>
      <button type="button" id="open-settings">Cài đặt</button>
    </nav>
  </header>

  <main class="layout">
    <aside class="character">
      <div class="portrait"><img id="char-img" alt="Saki"></div>
      <div class="char-text">
        <div class="char-name">Saki</div>
        <div class="status" id="status" role="status">Đang kết nối...</div>
      </div>
    </aside>

    <section class="chat">
      <ol class="messages" id="messages"></ol>
      <form class="composer" id="composer">
        <textarea id="input" rows="2" maxlength="4000"
                  placeholder="Nhắn cho Saki... (Enter để gửi, Shift+Enter để xuống dòng)"></textarea>
        <button type="submit" id="send" disabled>Gửi</button>
        <button type="button" id="stop" class="danger" hidden>Dừng</button>
      </form>
    </section>
  </main>

  <dialog id="memories-dialog" class="drawer" aria-labelledby="memories-title">
    <header>
      <h2 id="memories-title">Ghi nhớ</h2>
      <button type="button" data-close>Đóng</button>
    </header>
    <p class="note">Lịch sử trò chuyện và ghi nhớ là hai thứ khác nhau: /clear chỉ xóa lịch sử.</p>
    <form id="memory-form" class="row">
      <input id="memory-input" maxlength="200" placeholder="Điều Saki nên nhớ..." aria-label="Ghi nhớ mới">
      <button type="submit">Thêm</button>
    </form>
    <p class="form-msg" id="memory-msg" role="status"></p>
    <ul class="memory-list" id="memory-list"></ul>
  </dialog>

  <dialog id="settings-dialog" class="drawer" aria-labelledby="settings-title">
    <header>
      <h2 id="settings-title">Cài đặt</h2>
      <button type="button" data-close>Đóng</button>
    </header>
    <form id="settings-form" class="stack">
      <fieldset class="stack">
        <legend>Xưng hô</legend>
        <label>Saki tự xưng <input name="self_name" maxlength="20" required></label>
        <label>Gọi bạn là <input name="user_name" maxlength="20" required></label>
        <p class="hint">Ví dụ: em / anh</p>
      </fieldset>
      <label>Mô hình <input name="model" list="model-suggestions" required></label>
      <datalist id="model-suggestions">
        <option value="saki-lite"></option>
        <option value="saki-standard"></option>
      </datalist>
      <label>Nhân vật <select name="character_pack"></select></label>
      <p class="hint" id="pack-note"></p>
      <p class="form-msg" id="settings-msg" role="status"></p>
      <button type="submit">Lưu</button>
    </form>
    <hr>
    <button type="button" id="clear-history" class="danger">Xóa lịch sử trò chuyện</button>
  </dialog>
</body>
</html>
